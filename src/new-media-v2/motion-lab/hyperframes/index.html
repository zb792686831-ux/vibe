<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920,height=1080" />
  <title>留下的红心 · HyperFrames 动态样片</title>
  <link rel="stylesheet" href="style.css" />
  <script src="assets/gsap.min.js"></script>
  <script src="input.js"></script>
  <script src="geometry.js"></script>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080" data-fps="60">
    <div id="story" class="clip" data-start="0" data-duration="20" data-track-index="0" data-track-kind="graphics">
      <div id="black-ground"></div>
      <div id="pattern-ground"><div id="dots"></div><div id="vignette"></div></div>
      <div id="art">
        <div id="plate-travel" data-layout-allow-overflow>
          <img id="plate-hero" src="assets/images/cat-display-hero.png" alt="立体猫咪影像板" />
          <img id="plate-edge" src="assets/images/cat-display-edge.png" alt="同一影像板转侧" />
        </div>
        <div id="heart-glow" class="event-glow"></div>
        <svg id="signal-world" width="1920" height="1080" viewBox="0 0 1920 1080" aria-label="行为汇入记录，随后形成推荐参考">
          <defs>
            <linearGradient id="gold-rail" x1="0" x2="1"><stop stop-color="#69776d"/><stop offset=".5" stop-color="#dfc28b"/><stop offset="1" stop-color="#8b7957"/></linearGradient>
            <linearGradient id="mint-rail" x1="0" x2="1"><stop stop-color="#456861"/><stop offset=".55" stop-color="#afc9b6"/><stop offset="1" stop-color="#667b72"/></linearGradient>
            <radialGradient id="gate-material" cx="35%" cy="25%" r="80%"><stop stop-color="#f6e4b6"/><stop offset=".23" stop-color="#c4b28d"/><stop offset=".55" stop-color="#6e7165"/><stop offset=".8" stop-color="#202b2a"/><stop offset="1" stop-color="#a1a88c"/></radialGradient>
            <radialGradient id="small-gold" cx="30%" cy="22%"><stop stop-color="#f0dfb6"/><stop offset=".45" stop-color="#a99a76"/><stop offset="1" stop-color="#34423d"/></radialGradient>
            <radialGradient id="small-mint" cx="30%" cy="22%"><stop stop-color="#d0e2cb"/><stop offset=".45" stop-color="#819b8b"/><stop offset="1" stop-color="#233e3a"/></radialGradient>
          </defs>
          <path id="retained-orbit" d="M1050.86 235.15 A215 215 0 1 1 800.23 286.13" fill="none" stroke="#809887" stroke-width="8" stroke-linecap="round" pathLength="1"/>
          <g id="retained-arcs" fill="none" stroke-linecap="round">
            <path id="pause-arc" stroke="url(#gold-rail)" stroke-width="9"/>
            <path id="replay-arc" stroke="url(#mint-rail)" stroke-width="9"/>
            <g id="pause-bars" stroke="#dbc18b" stroke-width="13"><path d="M624 390 V462 M652 390 V462"/></g>
            <path id="replay-arrow" d="M1290 337 L1317 345 L1307 373" stroke="#b6cdb9" stroke-width="9"/>
          </g>
          <g id="flow-depth" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"><path id="top-shadow"/><path id="bottom-shadow"/></g>
          <g id="flow-highlights" fill="none" stroke-linecap="round"><path id="top-sheen" stroke="#f5e6bd" stroke-width="2.8"/><path id="bottom-sheen" stroke="#dce6d2" stroke-width="2.8"/></g>
          <g id="ambient-signals"><circle id="population-00" r="8" fill="url(#small-gold)"/><circle id="population-01" r="11" fill="url(#small-mint)"/><circle id="population-02" r="15" fill="url(#small-gold)"/><circle id="population-03" r="10" fill="url(#small-mint)"/><circle id="population-04" r="13" fill="url(#small-gold)"/><circle id="population-05" r="17" fill="url(#small-mint)"/><circle id="population-06" r="8" fill="url(#small-gold)"/><circle id="population-07" r="11" fill="url(#small-mint)"/><circle id="population-08" r="15" fill="url(#small-gold)"/><circle id="population-09" r="10" fill="url(#small-mint)"/><circle id="population-10" r="13" fill="url(#small-gold)"/><circle id="population-11" r="17" fill="url(#small-mint)"/><circle id="population-12" r="8" fill="url(#small-gold)"/><circle id="population-13" r="11" fill="url(#small-mint)"/><circle id="population-14" r="15" fill="url(#small-gold)"/><circle id="population-15" r="10" fill="url(#small-mint)"/><circle id="population-16" r="13" fill="url(#small-gold)"/><circle id="population-17" r="17" fill="url(#small-mint)"/><circle id="population-18" r="8" fill="url(#small-gold)"/><circle id="population-19" r="11" fill="url(#small-mint)"/><circle id="population-20" r="15" fill="url(#small-gold)"/><circle id="population-21" r="10" fill="url(#small-mint)"/><circle id="population-22" r="13" fill="url(#small-gold)"/><circle id="population-23" r="17" fill="url(#small-mint)"/></g>
          <g id="population-branches" fill="none" stroke-linecap="round" stroke-width="7"><path id="existing-in-top" d="M245 260 C365 260 390 355 485.255 329.704" stroke="#a79770"/><path id="existing-in-bottom" d="M280 650 C410 650 445 580 563.393 574.293" stroke="#819f8a"/><path id="existing-out-top" d="M1568.752 312.897 C1680 305 1700 220 1770 220" stroke="#a79770"/><path id="existing-out-bottom" d="M1568.655 552.852 C1670 560 1700 675 1770 675" stroke="#819f8a"/></g>
          <g id="input-pulses"><circle id="pause-pulse" r="16" fill="url(#small-gold)"/><circle id="replay-pulse" r="16" fill="url(#small-mint)"/></g>
          <g id="record-gate-back"><ellipse cx="1450" cy="430" rx="46" ry="73" fill="#040b0b" stroke="#152220" stroke-width="21"/><ellipse id="gate-back-ring" cx="1450" cy="430" rx="46" ry="73" fill="none" stroke="url(#gate-material)" stroke-width="16"/></g>
          <g id="recommendation" fill="none" stroke-linecap="round"><path id="out-top" stroke="#cfb783" stroke-width="8"/><path id="out-bottom" stroke="#a4bdab" stroke-width="8"/><circle id="out-top-node" cx="1660" cy="270" r="15" fill="url(#small-gold)"/><circle id="out-bottom-node" cx="1660" cy="600" r="15" fill="url(#small-mint)"/></g>
        </svg>
        <div id="reaction"><img id="morph-image" src="assets/images/morph/frame-000.png" alt="同一颗红心连续收成信号珠" /></div>
        <svg id="gate-foreground" width="1920" height="1080" viewBox="0 0 1920 1080"><path id="gate-front" d="M1450 357 C1511 357 1511 503 1450 503" fill="none" stroke="url(#gate-material)" stroke-width="16" stroke-linecap="round"/></svg>
        <div id="record-glow" class="event-glow"></div>
        <div id="pause-label" class="diagram-label">停留</div>
        <div id="replay-label" class="diagram-label">重看</div>
        <div id="like-label" class="diagram-label">点赞</div>
        <div id="record-label" class="diagram-label">记录</div>
      </div>
    </div>
    <div id="captions" class="clip" data-start="0" data-duration="20" data-track-index="2" data-track-kind="captions" data-layout-allow-caption-zone>
      <div id="caption-10" class="caption clip" data-start="0" data-duration="3" data-track-index="2" data-track-kind="captions"><span>顺手，点亮一颗<span class="coral">红心</span>。</span></div>
      <div id="caption-11" class="caption clip" data-start="3" data-duration="1.45" data-track-index="2" data-track-kind="captions"><span>然后，划走。</span></div>
      <div id="caption-12" class="caption clip" data-start="4.45" data-duration="1.65" data-track-index="2" data-track-kind="captions"><span>视频过去了。</span></div>
      <div id="caption-13" class="caption clip" data-start="6.1" data-duration="2.2" data-track-index="2" data-track-kind="captions"><span>你的反应，<span class="gold">留下了</span>。</span></div>
      <div id="caption-14" class="caption clip" data-start="8.3" data-duration="2.7" data-track-index="2" data-track-kind="captions"><span>刚才那几秒，去了哪里？</span></div>
      <div id="caption-15" class="caption clip" data-start="11" data-duration="3" data-track-index="2" data-track-kind="captions"><span><span class="gold">停留</span>、重看、点赞……</span></div>
      <div id="caption-16" class="caption clip" data-start="14" data-duration="3.5" data-track-index="2" data-track-kind="captions"><span>它们被平台记录，变成<span class="gold">信号</span>。</span></div>
      <div id="caption-17" class="caption clip" data-start="17.5" data-duration="2.5" data-track-index="2" data-track-kind="captions"><span>成为推荐的参考。</span></div>
    </div>
    <audio id="mix" class="clip" data-start="0" data-duration="20" data-track-index="3" data-volume="1" src="assets/mix.wav"></audio>
  </div>
  <script src="scene.js"></script>
</body>
</html>
